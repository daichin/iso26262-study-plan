<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>我的學習地圖 — ISO 26262 學習網站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap">
<link rel="stylesheet" href="/assets/css/theme.css">
<script src="/assets/vendor/chart.umd.min.js"></script>
</head>
<body>
<header id="app-header" data-current="index"></header>

<header class="masthead">
  <div class="masthead-inner">
    <p class="eyebrow">ISO 26262 學習網站</p>
    <h1>我的學習地圖</h1>
    <p class="standfirst">從核心工作往外拓展：先讀懂自己的工作本體，再逐圈認識會跟你交接、審查、討論的鄰近領域。</p>
  </div>
</header>

<div class="shell">
  <section id="map">
    <h2 class="step">同心圓學習地圖</h2>
    <p class="lede">從第 0 圈（地圖與共同語言）出發，第 1 圈是你的工作本體，再逐圈拓展到系統、硬體、概念管理與鄰近標準。</p>
    <figure>
      <svg viewBox="0 0 660 500" role="img" aria-label="八個同心圓分別代表第 0 圈到第 7 圈的學習範圍，由內而外逐步拓展">
        <g fill="none" stroke="currentColor" stroke-width="1.2" opacity=".38">
          <circle cx="180" cy="270" r="20"/>
          <circle cx="180" cy="270" r="46"/>
          <circle cx="180" cy="270" r="72"/>
          <circle cx="180" cy="270" r="98"/>
          <circle cx="180" cy="270" r="124"/>
          <circle cx="180" cy="270" r="150"/>
          <circle cx="180" cy="270" r="176"/>
          <circle cx="180" cy="270" r="202"/>
        </g>
        <circle cx="180" cy="270" r="20" fill="none" stroke="#0F6079" stroke-width="2"/>

        <g stroke="currentColor" stroke-width="1" opacity=".55">
          <line x1="180" y1="250" x2="412" y2="250"/>
          <line x1="180" y1="224" x2="412" y2="224"/>
          <line x1="180" y1="198" x2="412" y2="198"/>
          <line x1="180" y1="172" x2="412" y2="172"/>
          <line x1="180" y1="146" x2="412" y2="146"/>
          <line x1="180" y1="120" x2="412" y2="120"/>
          <line x1="180" y1="94"  x2="412" y2="94"/>
          <line x1="180" y1="68"  x2="412" y2="68"/>
        </g>

        <g font-family="IBM Plex Mono, monospace" font-size="10.5" fill="currentColor">
          <circle cx="180" cy="250" r="8" fill="#0F6079"/><text x="180" y="253.5" text-anchor="middle" fill="#fff">0</text>
          <circle cx="180" cy="224" r="8" fill="none" stroke="currentColor"/><text x="180" y="227.5" text-anchor="middle">1</text>
          <circle cx="180" cy="198" r="8" fill="none" stroke="currentColor"/><text x="180" y="201.5" text-anchor="middle">2</text>
          <circle cx="180" cy="172" r="8" fill="none" stroke="currentColor"/><text x="180" y="175.5" text-anchor="middle">3</text>
          <circle cx="180" cy="146" r="8" fill="none" stroke="currentColor"/><text x="180" y="149.5" text-anchor="middle">4</text>
          <circle cx="180" cy="120" r="8" fill="none" stroke="currentColor"/><text x="180" y="123.5" text-anchor="middle">5</text>
          <circle cx="180" cy="94"  r="8" fill="none" stroke="currentColor"/><text x="180" y="97.5"  text-anchor="middle">6</text>
          <circle cx="180" cy="68"  r="8" fill="none" stroke="currentColor"/><text x="180" y="71.5"  text-anchor="middle">7</text>
        </g>

        <g font-family="Noto Sans TC, sans-serif" font-size="13" fill="currentColor">
          <text x="420" y="253.5">第 0 圈・地圖　詞彙與導讀</text>
          <text x="420" y="227.5">第 1 圈・核心　軟體層開發（Part 6）</text>
          <text x="420" y="201.5">第 2 圈・支援流程（Part 8）</text>
          <text x="420" y="175.5">第 3 圈・安全分析（Part 9）</text>
          <text x="420" y="149.5">第 4 圈・系統層（Part 4）</text>
          <text x="420" y="123.5">第 5 圈・硬體層（Part 5）</text>
          <text x="420" y="97.5">第 6 圈・概念與管理（Part 2/3）</text>
          <text x="420" y="71.5">第 7 圈・鄰近標準</text>
        </g>

        <text x="180" y="266" text-anchor="middle" font-family="Noto Serif TC, serif" font-size="11" font-weight="700" fill="#0F6079">起點</text>
        <text x="180" y="280" text-anchor="middle" font-family="Noto Sans TC, sans-serif" font-size="9.5" fill="currentColor" opacity=".7">共同語言</text>
      </svg>
      <figcaption><b>越靠中心越核心。</b>第 0 圈建立共同語言、第 1 圈是軟韌體工程師的工作本體，之後每往外一圈，都是會跟你工作產生交集、但不是你每天在寫的範圍。</figcaption>
    </figure>
  </section>

  <section id="progress">
    <h2 class="step">我的進度</h2>
    <p class="lede">每一圈作答測驗後，最佳成績會累積在這裡。分數存在你自己的帳號底下，換裝置、換瀏覽器登入都看得到。</p>
    <figure>
      <canvas id="progressChart" height="90"></canvas>
    </figure>
  </section>

  <section id="circles">
    <h2 class="step">開始學習</h2>
    <div class="card-grid" id="circleCards"></div>
  </section>
</div>

<footer class="site-footer">ISO 26262 學習網站 v1.0 ・ 多使用者版</footer>

<script src="/assets/data/circles.js"></script>
<script src="/assets/data/sources.js"></script>
<script src="/assets/js/theme-toggle.js"></script>
<script src="/assets/js/api-client.js"></script>
<script src="/assets/js/nav.js"></script>
<script src="/assets/js/progress-dashboard.js"></script>
<script>
  window.ISO26262Dashboard.renderPersonalDashboard('progressChart', 'circleCards');
</script>
</body>
</html>
